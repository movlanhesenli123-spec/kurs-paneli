
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurs Paneli</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fc;color:#1e293b}
header{background:#2563eb;color:white;padding:22px}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;color:#dbeafe}
main{max-width:1200px;margin:25px auto;padding:0 15px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.card,.panel{background:white;border-radius:12px;padding:20px;box-shadow:0 3px 12px #0000000a}
.card h3{font-size:14px;color:#64748b;margin:0 0 12px}
.number{font-size:27px;font-weight:bold;color:#2563eb}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}
h2{font-size:19px;margin-top:0}
input,button{font:inherit;border-radius:7px;padding:10px;border:1px solid #cbd5e1}
input{width:100%;margin-bottom:10px}
button{cursor:pointer;background:#2563eb;color:white;border:none}
button:hover{opacity:.88}
.danger{background:#dc2626}
.add{width:100%;margin-bottom:15px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 7px;border-bottom:1px solid #e2e8f0}
th{font-size:12px;color:#64748b}
.name-action{background:none;color:#2563eb;padding:0;text-align:left;font-weight:bold}
.small{font-size:12px;color:#64748b}
.student-list{overflow-x:auto}
#loginBox{display:none;background:white;padding:20px;border-radius:12px;margin-bottom:20px}
@media(max-width:750px){.cards{grid-template-columns:1fr}.layout{grid-template-columns:1fr}header h1{font-size:21px}}
</style>
</head>
<body>
<header>
<h1>Kurs Paneli</h1>
<p>Şagirdlərin nəticələri və idarəetmə paneli</p>
</header>
<main>
<div class="cards">
<div class="card"><h3>Ümumi şagirdlər</h3><div class="number" id="total">0</div></div>
<div class="card"><h3>Ümumi bal</h3><div class="number" id="points">0</div></div>
<div class="card"><h3>Ən yüksək bal</h3><div class="number" id="best">0</div></div>
</div>

<div style="margin-bottom:15px">
<button onclick="showLogin()">Müəllim girişi</button>
<button onclick="logout()" style="background:#64748b">Çıxış</button>
</div>

<div id="loginBox">
<h2>Müəllim girişi</h2>
<input id="password" type="password" placeholder="Parolu daxil et">
<button onclick="login()">Daxil ol</button>
</div>

<div class="layout">
<section class="panel">
<h2>Şagirdlər</h2>
<div id="addBox" style="display:none">
<input id="studentName" placeholder="Şagirdin adı">
<button class="add" onclick="addStudent()">+ Şagird əlavə et</button>
</div>
<div class="student-list">
<table>
<thead><tr><th>Şagird</th><th>Bal</th><th>Status</th></tr></thead>
<tbody id="students"></tbody>
</table>
</div>
<p class="small">Şagirdin adını dəyişmək və ya silmək üçün adına bas.</p>
</section>
<section class="panel">
<h2>Reytinq</h2>
<div id="ranking">Hələ şagird yoxdur.</div>
</section>
</div>
</main>

<script>
const KEY="kursPanelData";
let teacher=false;
let data;

try{
data=JSON.parse(localStorage.getItem(KEY));
}catch(e){data=null}

if(!data || !Array.isArray(data.students)){
data={students:[],records:[]};
}

if(!Array.isArray(data.records)) data.records=[];

function save(){
localStorage.setItem(KEY,JSON.stringify(data));
render();
}

function showLogin(){
document.getElementById("loginBox").style.display="block";
}

function login(){
if(document.getElementById("password").value==="1985"){
teacher=true;
document.getElementById("loginBox").style.display="none";
document.getElementById("addBox").style.display="block";
render();
alert("Müəllim girişi uğurludur!");
}else{
alert("Parol yanlışdır!");
}
}

function logout(){
teacher=false;
document.getElementById("addBox").style.display="none";
render();
}

function addStudent(){
if(!teacher){alert("Əvvəl müəllim kimi daxil ol.");return}
const input=document.getElementById("studentName");
const name=input.value.trim();
if(!name){alert("Şagirdin adını yaz.");return}
if(data.students.some(s=>s.name.toLowerCase()===name.toLowerCase())){
alert("Bu adda şagird artıq var.");return;
}
data.students.push({id:Date.now(),name:name,points:0});
input.value="";
save();
}

function studentActions(id){
if(!teacher){
alert("Əvvəl müəllim parolu ilə daxil ol.");
return;
}

const s=data.students.find(x=>x.id===id);
if(!s)return;

const choice=prompt(
s.name+" üçün seçim et:\n1 — Adını dəyiş\n2 — Şagirdi sil\n0 — Ləğv et"
);

if(choice==="1"){
const newName=prompt("Yeni adı yaz:",s.name);
if(newName===null)return;
const name=newName.trim();
if(!name){alert("Ad boş ola bilməz.");return}
if(data.students.some(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase())){
alert("Bu adda başqa şagird var.");return;
}
s.name=name;
save();
}else if(choice==="2"){
if(confirm(s.name+" adlı şagird silinsin?")){
data.students=data.students.filter(x=>x.id!==id);
data.records=data.records.filter(r=>r.studentId!==id);
save();
}
}
}

function render(){
const students=document.getElementById("students");
students.innerHTML="";

data.students.forEach(s=>{
const tr=document.createElement("tr");
const tdName=document.createElement("td");
const nameButton=document.createElement("button");
nameButton.className="name-action";
nameButton.textContent=s.name;
nameButton.onclick=()=>studentActions(s.id);
tdName.appendChild(nameButton);

const tdPoints=document.createElement("td");
tdPoints.textContent=Number(s.points)||0;

const tdStatus=document.createElement("td");
tdStatus.textContent=(Number(s.points)||0)>=50?"Yaxşı":"Aktiv";

tr.append(tdName,tdPoints,tdStatus);
students.appendChild(tr);
});

const total=data.students.length;
const points=data.students.reduce((sum,s)=>sum+(Number(s.points)||0),0);
const best=data.students.reduce((max,s)=>Math.max(max,Number(s.points)||0),0);

document.getElementById("total").textContent=total;
document.getElementById("points").textContent=points;
document.getElementById("best").textContent=best;

const sorted=[...data.students].sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0));
document.getElementById("ranking").innerHTML=sorted.length
?sorted.map((s,i)=>`<p><b>${i+1}.</b> ${escapeHTML(s.name)} — ${Number(s.points)||0} bal</p>`).join("")
:"Hələ şagird yoxdur.";
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

render();
</script>
</body>
</html>
